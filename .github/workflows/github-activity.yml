name: GitHub activity

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed data
        run: |
          git diff --quiet -- data/github.json && exit 0
          git config user.name leanderme
          git config user.email 4583896+leanderme@users.noreply.github.com
          git add data/github.json
          git commit -m 'Update GitHub activity'
          git pull --rebase
          git push
