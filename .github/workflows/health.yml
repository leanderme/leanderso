name: Health

# Triggered each morning by the iOS Shortcut described in docs/live-data.md.
on:
  repository_dispatch:
    types: [health]

permissions:
  contents: write

concurrency:
  group: data-commit

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/record-health.mjs
        env:
          HEALTH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      - name: Commit changed data
        run: |
          git diff --quiet -- data/health.json && exit 0
          git config user.name leanderme
          git config user.email 4583896+leanderme@users.noreply.github.com
          git add data/health.json
          git commit -m 'Update health summary'
          git pull --rebase
          git push
